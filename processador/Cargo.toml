[package]
name = "processador"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
url = "2.3"
chrono = "0.4"
csv = "1.2"
rand = "0.8"

[target.'cfg(target_os = "wasi")'.dependencies]
hyper = { package = "hyper_wasi", version = "0.15", features = ["full"] }
tokio = { package = "tokio_wasi", version = "1", features = ["io-util", "fs", "net", "time", "rt", "macros"] }
reqwest = { package = "reqwest_wasi", version = "0.11", features = ["json"] }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
hyper = { version = "0.14", features = ["full"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }